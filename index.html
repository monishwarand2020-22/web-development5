<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopEasy is a modern responsive e-commerce product catalog."
    >

    <meta name="theme-color" content="#2563eb">

    <title>ShopEasy | Modern Product Catalog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="container navbar">

            <a href="#/" class="logo" aria-label="ShopEasy home">
                ShopEasy
            </a>

            <nav aria-label="Main navigation">

                <ul class="nav-links">

                    <li>
                        <a href="#/" data-route="home">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="#/products" data-route="products">
                            Products
                        </a>
                    </li>

                    <li>
                        <a href="#/about" data-route="about">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="#/cart" data-route="cart">
                            Cart
                            <span
                                id="cart-count"
                                class="cart-count"
                                aria-label="0 items in cart"
                            >
                                0
                            </span>
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main id="app">

        <!-- JavaScript dynamically renders pages here -->

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 ShopEasy. All rights reserved.
            </p>

            <p>
                Full-Stack Deployment & Project Architecture Capstone Project
            </p>

        </div>

    </footer>


    <script type="module" src="app.js"></script>

</body>
</html>
